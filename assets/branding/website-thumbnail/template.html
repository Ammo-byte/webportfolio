<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aamodit Acharya Website Thumbnail</title>
    <style>
      @font-face {
        font-family: "Determination";
        src: url("../../fonts/determination/determination.ttf")
          format("truetype");
        font-weight: 500;
      }

      @font-face {
        font-family: "Silkscreen";
        src: url("../../../node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2")
          format("woff2");
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #070809;
      }

      .thumbnail {
        position: relative;
        display: grid;
        width: 1200px;
        height: 630px;
        align-items: center;
        padding: 72px 78px;
        overflow: hidden;
        background:
          linear-gradient(rgba(7, 8, 9, 0.12), rgba(7, 8, 9, 0.12)),
          url("../linkedin-banner/background-source.png") right center / cover
            no-repeat;
      }

      .copy {
        position: relative;
        z-index: 1;
        margin-top: 26px;
      }

      h1 {
        margin: 0;
        color: #f2eee6;
        font-family: "Determination", monospace;
        font-size: 110px;
        font-weight: 500;
        letter-spacing: 2px;
        line-height: 0.84;
        text-transform: uppercase;
      }

      .role {
        margin: 50px 0 0 5px;
        color: #f2eee6;
        font-family: "Silkscreen", monospace;
        font-size: 25px;
        letter-spacing: 2px;
        line-height: 1;
        text-transform: uppercase;
      }

      .role span {
        color: #38a9f4;
      }

      .logo {
        position: absolute;
        top: 74px;
        right: 100px;
        z-index: 1;
        width: 144px;
        height: 144px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <main class="thumbnail" aria-label="Aamodit Acharya website thumbnail">
      <div class="copy">
        <h1>Aamodit<br />Acharya</h1>
        <p class="role">Applied Scientist <span>@ Ramp</span></p>
      </div>
      <img
        class="logo"
        src="../../Images/pixel/logo-dark.png"
        alt=""
        width="144"
        height="144"
      />
    </main>
  </body>
</html>
